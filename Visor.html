<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario por Folio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .loading {
            text-align: center;
            padding: 30px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .icono-equipo {
            font-size: 48px;
            text-align: center;
            margin-bottom: 10px;
        }
        
        .titulo {
            color: #1a237e;
            font-size: 24px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .campo {
            margin: 15px 0;
            padding: 12px 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        
        .etiqueta {
            font-size: 11px;
            text-transform: uppercase;
            color: #7f8c8d;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        
        .valor {
            font-size: 18px;
            color: #2c3e50;
            margin-top: 3px;
            font-weight: 500;
        }
        
        .error {
            text-align: center;
            padding: 30px 20px;
        }
        
        .error h2 {
            color: #e74c3c;
            margin-bottom: 10px;
        }
        
        .error p {
            color: #7f8c8d;
            margin: 5px 0;
        }
        
        .badge {
            display: inline-block;
            background: #27ae60;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 15px;
        }
        
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 11px;
            color: #bdc3c7;
        }
        
        .folio-destacado {
            background: #1a237e;
            color: white;
            padding: 2px 10px;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card" id="contenido">
    <div class="loading">
        <div class="spinner"></div>
        <p>Cargando información del equipo...</p>
    </div>
</div>

<script>
    // =====================================================
    // 🔧 CONFIGURACIÓN - CAMBIA SOLO ESTO
    // =====================================================
    
    // 1. El ID de tu Google Sheets (el que está en la URL de compartir)
    //    Ejemplo: https://drive.google.com/file/d/ABC123_xyz/view
    //    El ID sería: ABC123_xyz
    const SPREADSHEET_ID = 'AQUI_VA_TU_ID_DE_GOOGLE_SHEETS';
    
    // 2. El nombre de la hoja (pestaña) donde están los datos
    const SHEET_NAME = 'Hoja 1';
    
    // 3. Las columnas en tu Excel (en el mismo orden que aparecen)
    const COLUMNAS = ['inventario', 'folio', 'marca', 'ultimaVerificacion', 'ubicacion'];
    
    // =====================================================
    // NO TOCAR DEBAJO DE ESTA LÍNEA
    // =====================================================
    
    function obtenerParametro(nombre) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(nombre);
    }
    
    async function obtenerDatosDeGoogleSheets() {
        const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;
        
        try {
            const response = await fetch(url);
            const texto = await response.text();
            
            // Extraer el JSON del formato de Google
            const jsonStr = texto.substring(47, texto.length - 2);
            const data = JSON.parse(jsonStr);
            
            // Convertir a formato amigable
            const filas = data.table.rows;
            const resultados = [];
            
            for (let i = 1; i < filas.length; i++) { // Empezar desde 1 para saltar encabezados
                const fila = filas[i];
                const obj = {};
                for (let j = 0; j < COLUMNAS.length; j++) {
                    obj[COLUMNAS[j]] = fila.c[j] ? fila.c[j].v : '';
                }
                resultados.push(obj);
            }
            
            return resultados;
        } catch (error) {
            console.error('Error al cargar datos:', error);
            return null;
        }
    }
    
    function obtenerIconoPorTipo(inventario) {
        const tipos = {
            'laptop': '💻',
            'proyector': '📽️',
            'monitor': '🖥️',
            'impresora': '🖨️',
            'tablet': '📱',
            'computadora': '🖥️',
            'teclado': '⌨️',
            'mouse': '🖱️'
        };
        
        const lower = inventario.toLowerCase();
        for (const [key, icon] of Object.entries(tipos)) {
            if (lower.includes(key)) return icon;
        }
        return '📌';
    }
    
    async function mostrarEquipo() {
        const contenedor = document.getElementById('contenido');
        const folioBuscado = obtenerParametro('folio');
        
        // Si no hay folio en la URL
        if (!folioBuscado) {
            contenedor.innerHTML = `
                <div class="error">
                    <h2>📱 Escanea un código QR</h2>
                    <p>Este visor mostrará la información del equipo</p>
                    <div style="margin-top: 15px; padding: 10px; background: #f0f4f8; border-radius: 8px;">
                        <p style="font-size: 14px; color: #555;">Ejemplo de URL:</p>
                        <code style="background: #e8eef5; padding: 4px 8px; border-radius: 4px; font-size: 12px;">
                            visor.html?folio=FOL-001
                        </code>
                    </div>
                    <div class="badge">Sistema de inventario</div>
                </div>
            `;
            return;
        }
        
        // Mostrar loading
        contenedor.innerHTML = `
            <div class="loading">
                <div class="spinner"></div>
                <p>Buscando equipo <strong>${folioBuscado}</strong>...</p>
            </div>
        `;
        
        // Obtener datos de Google Sheets
        const datos = await obtenerDatosDeGoogleSheets();
        
        if (!datos) {
            contenedor.innerHTML = `
                <div class="error">
                    <h2>⚠️ Error de conexión</h2>
                    <p>No se pudo cargar el inventario</p>
                    <p style="font-size: 14px; margin-top: 10px; color: #95a5a6;">
                        Verifica tu conexión a internet y que el archivo esté publicado
                    </p>
                </div>
            `;
            return;
        }
        
        // Buscar el equipo por folio
        const equipo = datos.find(item => item.folio === folioBuscado);
        
        if (!equipo) {
            contenedor.innerHTML = `
                <div class="error">
                    <h2>❌ Equipo no encontrado</h2>
                    <p>No existe un equipo con el folio:</p>
                    <p style="font-size: 24px; font-weight: bold; color: #1a237e; margin: 10px 0;">
                        ${folioBuscado}
                    </p>
                    <p style="font-size: 14px; color: #95a5a6; margin-top: 10px;">
                        Verifica que el folio sea correcto
                    </p>
                </div>
            `;
            return;
        }
        
        // Obtener icono según el tipo de equipo
        const icono = obtenerIconoPorTipo(equipo.inventario);
        
        // Mostrar los datos del equipo encontrado
        contenedor.innerHTML = `
            <div class="icono-equipo">${icono}</div>
            <h1 class="titulo">${equipo.inventario || 'Equipo'}</h1>
            
            <div class="campo">
                <div class="etiqueta">🔢 Folio</div>
                <div class="valor"><span class="folio-destacado">${equipo.folio}</span></div>
            </div>
            
            <div class="campo">
                <div class="etiqueta">🏷️ Marca</div>
                <div class="valor">${equipo.marca || 'No especificada'}</div>
            </div>
            
            <div class="campo">
                <div class="etiqueta">📅 Última verificación</div>
                <div class="valor">${equipo.ultimaVerificacion || 'No registrada'}</div>
            </div>
            
            <div class="campo">
                <div class="etiqueta">📍 Ubicación</div>
                <div class="valor">${equipo.ubicacion || 'No especificada'}</div>
            </div>
            
            <div style="text-align: center; margin-top: 15px;">
                <span class="badge">✅ Datos actualizados</span>
            </div>
            
            <div class="footer">
                Última actualización: ${new Date().toLocaleString('es-ES', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                })}
            </div>
        `;
    }
    
    // Ejecutar al cargar la página
    mostrarEquipo();
</script>

</body>
</html>
